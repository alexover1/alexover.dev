{{ define "main" }}
  <h1 class="fs-2 mb-4">{{ .Title }}</h1>
  {{ with .Content }}<div class="mb-4">{{ . }}</div>{{ end }}

  {{ $pages := .Pages }}
  {{ if eq .Kind "taxonomy" }}{{ $pages = .Pages }}{{ end }}

  {{ range $pages }}
    {{ partial "post-preview.html" (dict "page" .) }}
  {{ end }}
{{ end }}
