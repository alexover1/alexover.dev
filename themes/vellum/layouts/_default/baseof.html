<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="d-flex flex-column min-vh-100">
  {{ partial "header.html" . }}
  <main class="container flex-grow-1 mb-5">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
    const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
    document.addEventListener('click', (e) => {
      popoverList.forEach(popover => {
        const trigger = popover._element
        const tip = popover.tip
        if (trigger.contains(e.target) || (tip && tip.contains(e.target))) return
        popover.hide()
      })
    })

    const toc = document.getElementById('TableOfContents')
    if (toc) {
      const links = [...toc.querySelectorAll('a[href^="#"]')]
      const targets = links
        .map(a => ({ link: a, el: document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1))) }))
        .filter(t => t.el)
      const offset = () => window.innerHeight * 0.2
      const update = () => {
        let active = null
        const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2
        if (atBottom && targets.length) {
          active = targets[targets.length - 1]
        } else {
          for (const t of targets) {
            if (t.el.getBoundingClientRect().top - offset() <= 0) active = t
            else break
          }
          if (!active && targets.length) active = targets[0]
        }
        for (const t of targets) t.link.classList.toggle('active', t === active)
      }
      update()
      window.addEventListener('scroll', update, { passive: true })
      window.addEventListener('resize', update)
    }
  </script>
</body>
</html>
