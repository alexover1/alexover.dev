{{ $eyebrow := .eyebrow | default "Nothing here" }}
{{ $title := .title | default "No posts yet" }}
{{ $message := .message | default "There's nothing to show here — yet. Check back later, or head home for something to read." }}
<div class="text-center my-5 py-5">
  <p class="text-uppercase text-body-secondary small fw-light mb-2" style="letter-spacing: 1.15px">{{ $eyebrow }}</p>
  <h1 class="display-3 fw-bold mb-3">{{ $title }}</h1>
  <p class="text-body-secondary mb-4">{{ $message }}</p>
  <a href="{{ "/" | relURL }}" class="btn btn-dark">Back to home</a>
</div>
