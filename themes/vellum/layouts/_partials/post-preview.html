{{ $featured := .featured | default false }}
{{ $page := .page }}
<article class="card mb-3 border-0 border-start border-4 {{ if $featured }}bg-dark text-white border-primary{{ else }}border-primary-subtle bg-body-tertiary{{ end }}">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 flex-wrap mb-1 small {{ if $featured }}text-white-50{{ else }}text-body-secondary{{ end }}">
      <time datetime="{{ $page.Date.Format "2006-01-02" }}">{{ $page.Date.Format "Jan 2, 2006" }}</time>
      {{ range $page.Params.tags }}
        <a class="badge rounded-pill text-bg-light text-decoration-none" href="{{ "/tags/" | relURL }}{{ . | urlize }}/">#{{ . }}</a>
      {{ end }}
    </div>
    <h3 class="{{ if $featured }}fs-3{{ else }}fs-5{{ end }} mb-1">
      <a class="{{ if $featured }}text-white{{ else }}text-body{{ end }} text-decoration-none stretched-link" href="{{ $page.RelPermalink }}">{{ $page.Title }}</a>
    </h3>
    <p class="mb-0 {{ if $featured }}text-white-50{{ else }}text-body-secondary{{ end }}">{{ $page.Summary | plainify }}</p>
  </div>
</article>
