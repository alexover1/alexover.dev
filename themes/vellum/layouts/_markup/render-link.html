<!-- trailing {{- "" -}} is required to remove extra space " " -->
<a class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
  href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
>
  {{- with .Text }}{{ . }}{{ end -}}
</a>
{{- "" -}}
