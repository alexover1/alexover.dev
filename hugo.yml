baseUrl: /
locale: en-us
title: alexover.dev
theme: vellum

params:
  author: Alex Overstreet
  avatar: /images/profile-alex.png
  defaultAvatar: /images/profile-user.svg
  tagline: programmer · game designer · writer
  intro: Writing about design, security, games, and the questions underneath the code I ship.
  github: https://github.com/alexover1
  now:
    building: a puzzle game in C
    reading: The Purpose Driven Life · Rick Warren
    thinking: what makes "the most reusable code"

menu:
  main:
    - { name: home, url: /, weight: 1 }
    - { name: articles, url: /articles/, weight: 2 }
    - { name: notes, url: /notes/, weight: 3 }
    - { name: tags, url: /tags/, weight: 4 }

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    style: lovelace
    wrapperClass: border-start border-2 px-3

enableGitInfo: true

