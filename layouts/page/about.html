{{ define "main" }}
  <div class="row gx-5">
    <div class="col-lg-8 mx-auto">
      <header class="article-header mx-auto mt-4 mb-4 pb-3 border-bottom">
        <div class="d-flex align-items-center gap-4 flex-wrap">
          <img src="{{ .Site.Params.avatar | relURL }}" alt="{{ .Site.Params.author }}" class="rounded-circle flex-shrink-0" width="120" height="120" style="object-fit: cover">
          <div>
            <h1 class="fs-1 fw-bold mb-2">{{ .Title }}</h1>
            {{ with .Params.summary }}
              <p class="fs-5 text-body-secondary mb-0">{{ . }}</p>
            {{ end }}
          </div>
        </div>
      </header>

      <article class="article-body mx-auto">
        {{ .Content }}
      </article>
    </div>
  </div>
{{ end }}
